<?xml version="1.0" encoding="UTF-8"?>
<!-- Play feature graphic (1024x500). The listing hero: the launcher mark at
     left, the name and the one-line pitch at right, on the icon's dark field.
     Fonts resolve through fontconfig at render time; the stack falls back to
     whatever sans the machine has, which is fine for a hero. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <rect width="1024" height="500" fill="#0E1726"/>
  <!-- The launcher mark (store-assets/icon-512.svg, 100-unit design, background
       dropped since this field is the same #0E1726) scaled 4.4x; its 64-unit
       frame spans x 59-341, centred at (200,250). -->
  <g transform="translate(-20 30) scale(4.4)">
    <defs>
      <clipPath id="top"><rect x="18" y="18" width="64" height="30.8"></rect></clipPath>
      <clipPath id="bl"><rect x="18" y="51.2" width="30.8" height="30.8"></rect></clipPath>
      <clipPath id="br"><rect x="51.2" y="51.2" width="30.8" height="30.8"></rect></clipPath>
    </defs>
    <g clip-path="url(#top)" fill="#F2B705">
      <circle cx="50" cy="50" r="11"></circle>
      <path d="M50 35 L50 29 M58.82 37.87 L62.34 33.01 M41.18 37.87 L37.66 33.01 M64.27 45.37 L69.97 43.51 M35.73 45.37 L30.03 43.51" fill="none" stroke="#F2B705" stroke-width="2.8" stroke-linecap="round"></path>
    </g>
    <g clip-path="url(#bl)" fill="#F2B705">
      <circle cx="50" cy="50" r="11"></circle>
      <path d="M35.73 54.64 L30.03 56.49" fill="none" stroke="#F2B705" stroke-width="2.8" stroke-linecap="round"></path>
      <g stroke="#0E1726" stroke-width="2.4"><circle cx="29" cy="69" r="5"></circle><circle cx="35" cy="65.5" r="6.5"></circle><circle cx="41" cy="69" r="5"></circle><rect x="24" y="68" width="22" height="7" rx="3.5"></rect></g>
      <g fill="#ECEDEF"><circle cx="29" cy="69" r="5"></circle><circle cx="35" cy="65.5" r="6.5"></circle><circle cx="41" cy="69" r="5"></circle><rect x="24" y="68" width="22" height="7" rx="3.5"></rect></g>
    </g>
    <g clip-path="url(#br)" fill="#ECEDEF">
      <circle cx="45" cy="50" r="8"></circle><circle cx="57" cy="48" r="9.5"></circle><rect x="35" y="52" width="35" height="10" rx="5"></rect>
      <path d="M55 67 L57 74 M62 67 L64 74 M69 67 L71 74" fill="none" stroke="#2E9BD6" stroke-width="2.8" stroke-linecap="round"></path>
    </g>
    <g stroke="#EC6A1E" stroke-width="4" fill="none" stroke-linecap="square">
      <line x1="50" y1="50" x2="50" y2="82"></line><line x1="18" y1="50" x2="82" y2="50"></line>
      <rect x="18" y="18" width="64" height="64"></rect>
    </g>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#F4F6FA">
    <text x="400" y="225" font-size="72" font-weight="300" letter-spacing="-1">Just My Weather</text>
    <text x="402" y="290" font-size="30" font-weight="400" fill="#AEB7C6">Pick what you see. Set your own alerts.</text>
    <text x="402" y="340" font-size="22" font-weight="400" fill="#F2B705" letter-spacing="3">MODULAR · CUSTOM · FREE</text>
  </g>
</svg>
