# just-my-weather CI, on the Raylytics VC Standard template (templates/ci/android.yml,
# STANDARD.md §8, §12) merged with the previous workflow: the pre-commit, test and
# build jobs the Tier 1 ruleset requires by name, plus the repo's own Maestro UI
# job. Actions are pinned to full commit SHAs (version in the trailing comment),
# resolved with `gh api` on 2026-10-27; bump deliberately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only ever needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # ktlint (through the Gradle plugin, so the hook and this job agree on the
    # ktlint version), gitleaks, whitespace and large-file checks: the same
    # hooks `pre-commit install` runs on a contributor's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # `packages` is explicit because the action's default list still names
      # "tools", a package Google removed from the SDK repository; sdkmanager
      # then exits 1 and the job dies before Gradle runs. The platform and
      # build-tools are installed by the step below.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # assembleDebugAndroidTest COMPILES the instrumented tests without a
      # device: without it nothing type-checks that source set, so renaming a
      # composable would break those tests silently.
      - name: Unit tests and instrumented-test compile
        run: >-
          ./gradlew :app:testDebugUnitTest :shared:testAndroidHostTest
          :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,60}$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must match $pattern (it becomes the squash commit subject)"
            exit 1
          fi

  # Separate job so the fast gates above still report in a few minutes: booting
  # an emulator costs several more. UI regressions used to ship silently because
  # the Maestro flows only ever ran by hand.
  ui:
    name: Maestro UI flows
    runs-on: ubuntu-latest
    # Emulator boot plus up to two full suite passes. Without this the job
    # inherits the 360-minute default, and a wedged device would hold a runner
    # for hours.
    timeout-minutes: 45
    # No continue-on-error anywhere: it would render a failed flow green and
    # suppress the on-failure artifact upload that diagnoses it. `ui` is simply
    # not a required check, so a red flow is visible without blocking merges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The CLI *version* is pinned and asserted below. The installer script
      # itself is still fetched fresh and executed; that remote-code surface is
      # a known tradeoff, not something this pin closes.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.5.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          v="$("$HOME/.maestro/bin/maestro" --version | tr -d '\r' | tail -1)"
          [ "$v" = "$MAESTRO_VERSION" ] \
            || { echo "::error::expected maestro $MAESTRO_VERSION, got '$v'"; exit 1; }
          echo "maestro $v (pinned)"

      # KVM is what makes an x86_64 emulator usable on a CI runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35: Android 15 enforces edge-to-edge for targetSdk 35.
      - name: Run Maestro flows
        id: maestro
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          # 3, not 4: the runners have 4 vCPUs, and handing every one to qemu
          # starves maestro/adb while they drive the UI.
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # ONE line: this action runs `script:` one line per `sh -c`. The logic
          # lives in a checked-in script, which is also runnable locally.
          script: bash .github/scripts/ui-flows.sh

      # The instrumented tests run inside that script and BEFORE Maestro; a
      # report that exists is worth keeping either way (always(), not failure()).
      - name: Upload instrumented-test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidtest-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Upload Maestro output on failure or retry
        # Keep the artifact when the step failed AND when a retry rescued a
        # failed first pass, so recurring flakiness keeps its evidence.
        if: >-
          always() && (steps.maestro.outcome == 'failure'
          || hashFiles('maestro-retried') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore
