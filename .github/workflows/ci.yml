name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the code. Declared explicitly so
# the token can't inherit a wider repo default — this workflow runs third-party
# actions, and a read-only token limits what a compromised one could do.
permissions:
  contents: read

# Don't let stale runs pile up on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test · ktlint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The same gate the pre-commit hook runs locally.
      - name: Test, ktlint, and assemble
        run: ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:assembleDebug --no-daemon --stacktrace

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Separate job so the fast gate above still reports in ~3 minutes: booting an
  # emulator costs several more. UI regressions used to ship silently because
  # the Maestro flows only ever ran by hand.
  ui:
    name: Maestro UI flows
    runs-on: ubuntu-latest
    # NOT continue-on-error at job level: that resolves the job to success, so a
    # failed flow renders green and the regression stays as silent as before.
    # Only the flow-running step tolerates failure (it hits the live NWS API);
    # every setup and supply-chain step below reports red. `ui` is simply not a
    # required check, so a red flow surfaces without blocking merges.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # Same explicit SDK install as `gate`: don't trust whatever the runner
      # image happens to preinstall, which rotates.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The CLI *version* is pinned and asserted below. The installer script
      # itself is still fetched fresh and executed — that remote-code surface is
      # unchanged and is a known tradeoff, not something this pin closes.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.5.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # Assert, don't echo: if the installer ignores the variable or falls
          # back to latest, the pin was never in effect and we want a red step.
          v="$("$HOME/.maestro/bin/maestro" --version | tr -d '\r' | tail -1)"
          case "$v" in
            *"$MAESTRO_VERSION"*) echo "maestro $v (pinned)" ;;
            *) echo "::error::expected maestro $MAESTRO_VERSION, got '$v'"; exit 1 ;;
          esac

      # KVM is what makes an x86_64 emulator usable on a CI runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35: Android 15 enforces edge-to-edge for targetSdk 35, and an
      # API 34 image would not have caught the inset bug that shipped once.
      - name: Run Maestro flows
        # Only this step tolerates failure — live-API flakiness shouldn't turn
        # the whole workflow red, but everything above it must.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # One device here, but resolve and pass it explicitly anyway: a bare
            # `adb install` fans out, and Maestro ignores ANDROID_SERIAL. Keeping
            # the honest form means this is safe to copy.
            S=$(adb devices | awk '/^emulator-/ && $2=="device" {print $1; exit}')
            adb -s "$S" install -r app/build/outputs/apk/debug/app-debug.apk
            maestro --device "$S" test .maestro/

      - name: Upload Maestro output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore
