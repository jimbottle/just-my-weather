name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the code. Declared explicitly so
# the token can't inherit a wider repo default — this workflow runs third-party
# actions, and a read-only token limits what a compromised one could do.
permissions:
  contents: read

# Don't let stale runs pile up on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test · ktlint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The same gate the pre-commit hook runs locally.
      - name: Test, ktlint, and assemble
        run: ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:assembleDebug --no-daemon --stacktrace

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Separate job so the fast gate above still reports in ~3 minutes: booting an
  # emulator costs several more. UI regressions used to ship silently because
  # the Maestro flows only ever ran by hand.
  ui:
    name: Maestro UI flows
    runs-on: ubuntu-latest
    # Emulator boot plus up to two full suite passes. Without this the job
    # inherits the 360-minute default, and a wedged device would hold a runner
    # for hours — concurrency only reclaims it if a new push lands on this ref.
    timeout-minutes: 45
    # No continue-on-error anywhere. It sets the conclusion to success, which
    # both renders a failed flow green — the exact silence this job exists to
    # end — and suppresses the on-failure artifact upload that diagnoses it.
    # `ui` is simply not a required check, so a red flow is visible without
    # blocking merges. Live-API flakiness is absorbed at its source by the
    # retry in the script below, not by hiding the outcome.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # Same explicit SDK install as `gate`: don't trust whatever the runner
      # image happens to preinstall, which rotates.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The CLI *version* is pinned and asserted below. The installer script
      # itself is still fetched fresh and executed — that remote-code surface is
      # unchanged and is a known tradeoff, not something this pin closes.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.5.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # Assert, don't echo: if the installer ignores the variable or falls
          # back to latest, the pin was never in effect and we want a red step.
          v="$("$HOME/.maestro/bin/maestro" --version | tr -d '\r' | tail -1)"
          # Exact, not substring: 2.5.0 must not be satisfied by 12.5.0 or
          # 2.5.0-SNAPSHOT, or the gate stops meaning anything.
          [ "$v" = "$MAESTRO_VERSION" ] \
            || { echo "::error::expected maestro $MAESTRO_VERSION, got '$v'"; exit 1; }
          echo "maestro $v (pinned)"

      # KVM is what makes an x86_64 emulator usable on a CI runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35: Android 15 enforces edge-to-edge for targetSdk 35, and an
      # API 34 image would not have caught the inset bug that shipped once.
      - name: Run Maestro flows
        id: maestro
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          # 3, not 4: these runners have 4 vCPUs, and handing every one to qemu
          # starves maestro/adb during the phase where they drive the UI —
          # relocating the starvation rather than fixing it. (The launcher ANR
          # that motivated this is handled deterministically in the script.)
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # ONE line: this action runs `script:` one line per `sh -c`, so
          # shell state does not survive between lines. The logic lives in a
          # checked-in script, which is also runnable locally.
          script: bash .github/scripts/ui-flows.sh

      - name: Upload Maestro output on failure or retry
        # Keep the artifact when the step failed AND when a retry rescued a
        # failed first pass — otherwise the retry, which makes that the common
        # failure shape, would quietly erase the evidence of recurring
        # flakiness. Keyed on the marker the script actually writes, so a clean
        # pass uploads nothing (Maestro populates ~/.maestro/tests on success
        # too, so an unconditional upload is noise, not a no-op).
        if: >-
          always() && (steps.maestro.outcome == 'failure'
          || hashFiles(format('{0}/maestro-retried', runner.temp)) != '')
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore
