# Arrange mode on the glance grid: the launcher gesture, end to end on real
# touch events.
#
# This flow exists because the gesture path is the part unit and Compose tests
# cannot vouch for. Both of the bugs this feature shipped with were invisible
# to every other layer: a graphicsLayer that kept its last values so a dropped
# tile froze mid-air, and a tile-level gesture coroutine that died when a
# reorder re-targeted its composable, so the drop event never arrived. Only a
# real pointer stream reaches them.
#
# The drag IS covered now. It could not be while reordering needed
# hold-then-move for every tile: Maestro 2.5.0 has no such gesture (no
# `dragAndDrop`, and a coordinate `swipe` moves from the first frame so it
# never satisfies a long-press — probed on-device, the swipe reported COMPLETED
# and the order was unchanged). Once the tiles are wiggling a plain drag moves
# them, which is both the launcher behaviour and something a `swipe` can do.
#
# If you ever need a hold-then-move from the shell, use
# `adb shell input draganddrop` — NOT `adb shell input motionevent`, whose
# separate calls carry mismatched downTimes and are rejected as a broken
# gesture.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Wait for the glance. Arrange mode is not offered until there is something to
# arrange, so this also proves the grid rendered.
- extendedWaitUntil:
    visible: "Customize"
    timeout: 60000
- assertVisible:
    id: "module_temperature"
- assertNotVisible: "Done arranging"

# Long-press any tile to enter arrange mode. The tiles wiggle and take the
# accent border (neither is assertable here); the Done affordance is the part
# that must be discoverable, and its appearance is the assertion.
- longPressOn:
    id: "module_temperature"
- assertVisible: "Done arranging"

# A tap while arranging cycles that tile's width. The tile stays present at its
# new size — what must NOT happen is the tap being swallowed by the long-press
# that opened the mode, or the tile vanishing from the grid.
- tapOn:
    id: "module_conditions"
- assertVisible:
    id: "module_conditions"
- assertVisible:
    id: "module_temperature"

# A second tap cycles again — the mode stays live across taps rather than
# falling out of arrange after one edit.
- tapOn:
    id: "module_conditions"
- assertVisible: "Done arranging"

# Drag a tile with a PLAIN swipe — no second long-press, because the tiles are
# already wiggling. Both must still be on the grid afterwards and the mode
# still live: a drop that froze mid-air (the bug this gesture path shipped with
# once) leaves the grid looking intact in a screenshot while a tile sits
# outside its slot, so the flow keeps acting on them rather than stopping at a
# visibility check.
- swipe:
    start: "50%, 32%"
    end: "50%, 46%"
    duration: 800
- assertVisible:
    id: "module_temperature"
- assertVisible:
    id: "module_conditions"
- assertVisible: "Done arranging"

# Done leaves arrange mode; the grid stays, the editing affordance goes.
- tapOn: "Done arranging"
- assertNotVisible: "Done arranging"
- assertVisible:
    id: "module_temperature"
- assertVisible: "Refresh"

# The arrangement persisted: it went through the same ViewConfig/DataStore path
# as every other customization, so it must survive the app being killed.
- stopApp
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Customize"
    timeout: 60000
- assertVisible:
    id: "module_temperature"
- assertVisible:
    id: "module_conditions"
