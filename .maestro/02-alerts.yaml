# Personal alerts: build a rule, toggle it, remove it. This is the screen with
# the most state, and every control it needs is targeted by testTag — the
# switches and the value field carry no stable text, so text/relative selectors
# can't reach them (an earlier manual pass had to fall back to coordinate taps).
#
# Location is granted up front; the POST_NOTIFICATIONS prompt is NOT covered by
# that and is handled inline below. The rule is never expected to fire here:
# this covers the editing loop, not delivery (delivery needs a live NWS
# threshold crossing).
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 60000
- tapOn: "Alerts"

# Entering Alerts is where the app asks for POST_NOTIFICATIONS (API 33+) — that
# is the moment the user is opting in, and launchApp's blanket grant does not
# cover it. Whether the dialog appears depends on whether a previous grant
# survived `clearState` (observed: it does), so this must tolerate both: settle
# first so a dialog that renders a beat late isn't raced, then tap it only if
# it is actually there.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow"
    optional: true

- extendedWaitUntil:
    visible: "Add an alert"
    timeout: 10000

# A fresh install has no rules and says so.
- assertVisible:
    text: "No alerts yet.*"

# Build one: the default subject/comparison plus a threshold. The Add button
# sits below three wrapping chip rows, so scroll to it for the same reason the
# controls further down are scrolled to — CI's profile is not the local one.
- scrollUntilVisible:
    element:
      id: "addRule"
    direction: DOWN
# Assert it is genuinely disabled first — Maestro will happily "tap" a disabled
# Compose button and report success, so without this the enabling is untested.
- assertVisible:
    id: "addRule"
    enabled: false
- tapOn:
    id: "thresholdValue"
- inputText: "40"
- hideKeyboard
- assertVisible:
    id: "addRule"
    enabled: true
- tapOn:
    id: "addRule"
- extendedWaitUntil:
    visible: "Temperature below 40.*"
    timeout: 10000

# Toggles: assert the CHECKED STATE either side of each tap. The descriptive
# line under "Quiet hours" renders unconditionally, so asserting on it would
# pass even if the switch were wired to nothing.
- assertVisible:
    id: "toggleRule"
    checked: true
- tapOn:
    id: "toggleRule"
- assertVisible:
    id: "toggleRule"
    checked: false

# Quiet hours sits below the fold once a rule row exists, and CI runs a
# different device profile than local, so scroll to it rather than assuming
# it's on screen.
- scrollUntilVisible:
    element:
      id: "quietHours"
    direction: DOWN
- assertVisible:
    id: "quietHours"
    checked: false
- tapOn:
    id: "quietHours"
- assertVisible:
    id: "quietHours"
    checked: true

# Removing the last rule returns the calm empty state.
- scrollUntilVisible:
    element:
      id: "removeRule"
    direction: UP
- tapOn:
    id: "removeRule"
- extendedWaitUntil:
    visible: "No alerts yet.*"
    timeout: 10000

# Back to the glance, still rendering weather.
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 30000
