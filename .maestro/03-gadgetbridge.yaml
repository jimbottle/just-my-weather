# Gadgetbridge hand-off: the opt-in toggle exists, defaults to OFF, and its
# state survives leaving and re-entering the screen.
#
# Default-off is the assertion that matters. This setting sends weather to
# another app on the phone, so "off until asked" is a product promise, not a
# preference — a regression that flipped the default would be invisible in
# unit tests and would ship data-sharing nobody switched on.
#
# The broadcast itself isn't asserted here: without Gadgetbridge installed
# there is no receiver, and installing one to prove delivery is beyond a UI
# flow. The payload is covered exhaustively by GadgetbridgeWeatherTest, and
# the toggle-to-broadcast wiring by the app's own log line.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "App Settings"
    timeout: 60000
- tapOn: "App Settings"
- assertVisible: "App settings"

# The hand-off sits under Advanced, folded away until the switch opens it.
- assertNotVisible: "Send to Gadgetbridge"
- scrollUntilVisible:
    element:
      id: "advanced-toggle"
- assertVisible:
    id: "advanced-toggle"
    checked: false
- tapOn:
    id: "advanced-toggle"
- assertVisible: "Send to Gadgetbridge"

# Off by default. The Switch carries no text, so it's targeted by testTag,
# surfaced as a resource-id by the root semantics modifier in MainActivity.
- assertVisible:
    id: "gadgetbridge-toggle"
    checked: false

# Turning it on sticks across a trip back to the glance and in again.
- tapOn:
    id: "gadgetbridge-toggle"
- assertVisible:
    id: "gadgetbridge-toggle"
    checked: true
# Advanced opens itself when something inside it is on, so an active
# hand-off is never hidden.
- tapOn: "Done"
- tapOn: "App Settings"
- scrollUntilVisible:
    element:
      id: "gadgetbridge-toggle"
- assertVisible:
    id: "advanced-toggle"
    checked: true
- assertVisible:
    id: "gadgetbridge-toggle"
    checked: true
