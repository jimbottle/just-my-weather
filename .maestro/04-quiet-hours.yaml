# Quiet hours: the window is editable and the choice persists.
#
# The window used to be fixed at 22:00-07:00 with only an on/off switch, so the
# thing worth asserting is that a chosen window survives leaving the screen —
# a picker that shows the right number but doesn't persist would look correct
# on screen and silence the wrong hours at 3am, which nobody would notice.
#
# Both hour grids are on screen together, so the chips are addressed by
# namespaced tags (start_hour_N / end_hour_N); a bare hour_N would match twice.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Wait on "Refresh", which exists only on the glance. NOT "Alerts": that string
# is both the home button AND this screen's own title, so waiting on it can
# match a screen we never left. See the return leg below, where that mattered.
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 60000
- tapOn: "Alerts"

# Entering Alerts is where the app asks for POST_NOTIFICATIONS, which
# launchApp's blanket grant does NOT cover (see 02-alerts.yaml). Whether the
# dialog appears depends on whether an earlier grant survived clearState, so
# settle first and tap only if it is really there — otherwise the system window
# covers the screen and the assertions below fail for an unrelated reason.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow"
    optional: true

# The default window, shown on the row itself.
- assertVisible: "Deliver silently 22:00–07:00"

# Open the picker and choose a different window that still wraps midnight.
- tapOn:
    id: "quietWindow"
- assertVisible: "Starts"
- assertVisible: "Ends"
- tapOn:
    id: "start_hour_23"
- tapOn:
    id: "end_hour_6"
- tapOn:
    id: "saveQuietWindow"

# The row reflects the new window immediately.
- assertVisible: "Deliver silently 23:00–06:00"

# …and it survives a trip back to the glance and in again, which is what
# distinguishes a persisted setting from a bit of screen state.
#
# The return leg waits on "Refresh" deliberately. Waiting on "Alerts" would let
# this whole check pass vacuously: if the "Done" tap missed, "Alerts" would
# still match this screen's title, the next tap would hit that same title as a
# no-op, and the final assert would pass against unchanged in-memory state —
# a persistence test that cannot fail.
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 20000
- tapOn: "Alerts"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Deliver silently 23:00–06:00"
