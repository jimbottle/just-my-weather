# Cold-launch smoke test: the app opens and the default glance renders real
# weather from NWS, end to end.
#
# Location permission is GRANTED up front so no system dialog interrupts the
# run (the dialog is nondeterministic — Android stops showing it after repeated
# denials). With or without a device fix the app resolves a US location and
# fetches live data, so we assert the Ready-state shape (a temperature and the
# "Observed" provenance line) rather than a specific city.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Wait for the real network fetch to land in the Ready state. The budget is
# generous because the first load chains /points -> /stations -> /observations,
# which can be slow on a cold emulator or CI network.
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 60000
- assertVisible:
    text: ".*°"
- assertVisible:
    text: "Observed.*"

# Refresh: the button flips to the disabled "Refreshing…" label during the
# re-fetch, so waiting for it to reappear as "Refresh" genuinely spans a fetch
# cycle (not a no-op). The temperature must still be present afterwards.
- tapOn: "Refresh"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 60000
- assertVisible:
    text: ".*°"
