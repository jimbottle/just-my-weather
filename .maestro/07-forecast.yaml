# The forecast module and the option that lives on it.
#
# The framing used to be a screen-wide mode with three states, one of which
# ("Now") meant no forecast at all. It is two things now — whether the module
# shows, switched in the customize screen's field list like any other tile,
# and which framing it shows, on the module itself — so this flow walks both
# and the boundary between them.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Out of the box: the forecast shows, framed hourly.
- extendedWaitUntil:
    visible: "Forecast"
    timeout: 60000
- assertVisible:
    id: "forecast_hourly"
- assertVisible:
    id: "forecast_daily"

# The toggle switches framing in place. Daily tiles carry NWS period names, so
# a weekday appearing is the grid actually redrawing rather than the chip just
# looking selected.
- tapOn:
    id: "forecast_daily"
- extendedWaitUntil:
    visible: ".*(Today|Tonight|This Afternoon|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday).*"
    timeout: 30000

# Back to hourly, and the hero beside it is untouched by either — the framing
# is the forecast's own option, not the screen's.
- tapOn:
    id: "forecast_hourly"
- assertVisible:
    id: "module_temperature"

# Turning the forecast off takes the tile AND its toggle with it: the calm
# minimum is the glance by itself, which is what the old "Now" mode meant.
# The switch is the module's own row in the field list, like every tile's.
- tapOn: "Customize"
- assertVisible: "Customize view"
- tapOn:
    id: "toggle_forecast"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 30000
- assertNotVisible: "Forecast"
- assertNotVisible:
    id: "forecast_hourly"
# The glance survives — hiding one module must not disturb the others.
- assertVisible:
    id: "module_temperature"

# And it comes back, still framed the way it was left.
- tapOn: "Customize"
- tapOn:
    id: "toggle_forecast"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Forecast"
    timeout: 30000
- assertVisible:
    id: "forecast_hourly"
