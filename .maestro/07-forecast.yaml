# The forecast grid and the option that lives on it.
#
# The framing used to be a screen-wide mode with three states, one of which
# ("Now") meant no forecast at all. It is two things now — whether the grid
# shows, on the customize screen, and which framing it shows, on the grid
# itself — so this flow walks both and the boundary between them.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Out of the box: the forecast shows, framed hourly.
- extendedWaitUntil:
    visible: "Forecast"
    timeout: 60000
- assertVisible:
    id: "forecast_hourly"
- assertVisible:
    id: "forecast_daily"

# The toggle switches framing in place. Daily tiles carry NWS period names, so
# a weekday appearing is the grid actually redrawing rather than the chip just
# looking selected.
- tapOn:
    id: "forecast_daily"
- extendedWaitUntil:
    visible: ".*(Today|Tonight|This Afternoon|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday).*"
    timeout: 30000

# Back to hourly, and the glance above is untouched by either — the two grids
# are independent, which is the whole point of the forecast owning its option.
- tapOn:
    id: "forecast_hourly"
- assertVisible:
    id: "module_temperature"

# Turning the forecast off takes the grid AND its toggle with it: the calm
# minimum is the glance by itself, which is what the old "Now" mode meant.
- tapOn: "Customize"
- assertVisible: "Customize view"
- tapOn:
    id: "show-forecast-toggle"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 30000
- assertNotVisible: "Forecast"
- assertNotVisible:
    id: "forecast_hourly"
# The glance survives — hiding the second grid must not disturb the first.
- assertVisible:
    id: "module_temperature"

# And it comes back, still framed the way it was left.
- tapOn: "Customize"
- tapOn:
    id: "show-forecast-toggle"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Forecast"
    timeout: 30000
- assertVisible:
    id: "forecast_hourly"
